[package]
name = "meb-server"
version = "0.1.0"
description = "MEB-Dönüştür web server (local development foundation)"
authors = ["MEB-Dönüştür"]
license = "MIT"
edition = "2021"
publish = false

# Standalone package (not a Cargo workspace member) - see the comment in
# crates/meb-core/Cargo.toml. Its own default release profile keeps
# `panic = "unwind"`, which the job worker relies on: a panic inside one
# conversion is caught and fails only that job (see src/worker.rs).

[lib]
name = "meb_server"
path = "src/lib.rs"

[[bin]]
name = "meb-server"
path = "src/main.rs"

[dependencies]
meb-core = { path = "../meb-core" }
# Engine identity, resolution policy and the sandboxed process runner,
# shared verbatim with the desktop app (src-tauri). The ONLY way this
# server starts an external engine process.
meb-engines = { path = "../meb-engines" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
# Serves the built frontend next to the API (MIT). Only the `fs` feature:
# this is a file server, not a middleware stack.
tower-http = { version = "0.6", features = ["fs"] }
# `ServiceExt::oneshot`, to drive that file server from inside a handler -
# which is what lets the SPA fallback and the cache policy below be plain
# Rust rather than a layer whose behaviour is implicit.
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
percent-encoding = "2"
# MIT/Apache-2.0 - packs the per-page PDFs of a split job into the single
# archive the job model publishes.
zip = { version = "2", default-features = false, features = ["deflate"] }
# MIT - pure-Rust PDF manipulation, the same library the desktop app uses
# for its PDF text editing. It backs every PDF operation that needs no
# external engine at all (see src/engines/lopdf_ops.rs).
#
# NEWER than src-tauri's 0.33 on purpose: writing encryption
# (`Document::encrypt`) only exists from 0.34 onwards, and `pdf_protect`
# cannot be done without it. The two packages are independent (this is
# deliberately not a Cargo workspace), so the desktop app keeps its pinned
# version and is not touched by this.
#
# Default features off: they are date-formatting backends (chrono, jiff,
# time) and rayon, whose parallel object parsing would compete with the
# job worker's own concurrency rather than add to it.
lopdf = { version = "0.36", default-features = false }
# The OS CSPRNG, for the 256-bit AES file encryption key of a protected
# PDF. Already in the tree (uuid v4 uses it), and deliberately the raw
# system entropy source rather than a seeded userspace generator.
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Builds request bodies that stall mid-upload (idle-timeout tests).
futures-util = "0.3"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Builds the minimal OOXML/OpenDocument fixtures the upload tests use.
zip = { version = "2", default-features = false, features = ["deflate"] }
