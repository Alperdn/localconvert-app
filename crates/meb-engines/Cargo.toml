[package]
name = "meb-engines"
version = "0.1.0"
description = "External engine identity, resolution and sandboxed process execution shared by the desktop app and the web server"
authors = ["MEB-Dönüştür"]
license = "MIT"
edition = "2021"
publish = false

# Standalone package (not a Cargo workspace member) - see the comment in
# crates/meb-core/Cargo.toml for why: `src-tauri` and `meb-server` need
# different panic strategies and Cargo profiles are workspace-wide. Each
# consumer depends on this crate by path.
#
# Deliberately NOT part of `meb-core`: everything here spawns, or decides
# what may be spawned as, an operating-system process. `meb-core` is pure
# computation (decode/encode/probe) and must stay usable in a context that
# is not allowed to exec anything at all, which is a property the compiler
# can only keep enforcing while the two live in separate crates. It also
# keeps `meb-core`'s dependency set free of sha2/which/lazy_static.

[lib]
name = "meb_engines"
path = "src/lib.rs"

[dependencies]
# Same versions/features as src-tauri so both builds resolve identical code.
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"        # MIT/Apache-2.0 - bundled-engine manifest verification only
lazy_static = "1.4"  # MIT/Apache-2.0 - the in-process hash cache
which = "6"          # MIT - PATH lookup for the default system tier

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
