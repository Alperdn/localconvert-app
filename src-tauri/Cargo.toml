[package]
name = "localconvert"
version = "1.0.0"
description = "A privacy-focused local file converter"
authors = ["LocalConvert"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "localconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Phase 1 - Secure Desktop Foundation:
# tauri-plugin-shell, tauri-plugin-updater, tauri-plugin-opener and
# tauri-plugin-process were removed - unused by the frontend, or (updater/
# process) only served the now-removed silent auto-update flow. See the
# comment block in src/lib.rs for the full rationale.
#
# reqwest, futures-util, zip and chrono were removed - grep-verified unused
# anywhere in src/. An HTTP client sitting in the dependency tree of an
# offline-first app is exactly the kind of unused capability this phase is
# about eliminating, even though nothing in this codebase called it.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
which = "6"
uuid = { version = "1", features = ["v4"] }
lazy_static = "1.4"
open = "5"
lopdf = "0.33"  # MIT licensed PDF manipulation library
encoding_rs = "0.8"  # MIT/Apache 2.0 text encoding library
zip = { version = "2", default-features = false, features = ["deflate"] }  # MIT/Apache-2.0 - native ZIP, replaces 7z for the zip<->zip case
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }  # MIT/Apache-2.0 - pure-Rust raster codecs, replaces ImageMagick for common formats
tiff = "0.11"  # MIT/Apache-2.0 - already an `image` transitive dependency; used directly only to check for a second IFD (multi-page TIFF) so that case can be rejected instead of silently converting page 1

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
